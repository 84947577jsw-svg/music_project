<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Owi Magazine — 음악 아티클 아카이브</title>

<link rel="stylesheet" as="style"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />

<style>
  :root{
    --bg:#ececee; --paper:#fff; --ink:#161619; --ink-2:#6c6c72; --ink-3:#a6a6ac;
    --line:#e9e9eb; --blue:#c7c7cc; --blue-deep:#161619; --pink:#d6d6da; --lav:#cfcfd4; --mint:#d2d2d7;
    --chip:#f4f5f8; --radius:18px; --shadow:0 1px 2px rgba(43,44,52,.04),0 12px 30px rgba(90,110,150,.08);
    --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',Roboto,'Apple SD Gothic Neo',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);font-family:var(--font);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  img{max-width:100%;display:block}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  a{color:inherit;text-decoration:none}
  input,textarea,select{font-family:inherit}

  .app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 0 40px rgba(90,110,150,.10)}

  /* 상단바 */
  .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:saturate(160%) blur(10px);display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:8px}
  .brand .wm{font-size:18px;font-weight:800;letter-spacing:-.02em}
  .brand .wm em{font-style:normal;color:var(--blue-deep)}
  .brand svg{width:24px;height:24px}
  .icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:10px}
  .icon-btn:hover,.icon-btn:focus-visible{background:var(--chip)}
  .icon-btn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.6}

  /* 히어로 */
  .hero{padding:20px 20px 8px}
  .hero .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--blue-deep);letter-spacing:.08em;margin-bottom:11px}
  .hero .eyebrow svg{width:16px;height:16px}
  .hero-card{position:relative;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
  .hero-cover{aspect-ratio:4/5;position:relative}
  .hero-card:active{transform:scale(.992)}
  .hero-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(43,44,52,0) 38%,rgba(43,44,52,.06) 55%,rgba(43,44,52,.42) 100%)}
  .hero-text{position:absolute;left:22px;right:22px;bottom:22px;color:#fff}
  .hero-text .cat{font-size:10.5px;font-weight:700;letter-spacing:.12em;background:rgba(255,255,255,.20);backdrop-filter:blur(4px);padding:4px 10px;border-radius:999px;display:inline-block;margin-bottom:12px}
  .hero-text h1{margin:0;font-size:29px;font-weight:800;line-height:1.24;letter-spacing:-.025em}
  .hero-text p{margin:10px 0 0;font-size:13px;line-height:1.5;color:rgba(255,255,255,.88);font-weight:400}

  /* 커버 */
  .cover{width:100%;height:100%;position:relative;overflow:hidden}
  .cover img{width:100%;height:100%;object-fit:cover}
  .cover .sketch{position:absolute}
  .cv-blue{background:linear-gradient(150deg,#4c4c50,#2a2a2d 55%,#1a1a1d)}
  .cv-pink{background:linear-gradient(150deg,#57575b,#333336 55%,#202023)}
  .cv-lav{background:linear-gradient(150deg,#45454a,#262629 55%,#161619)}
  .cv-mint{background:linear-gradient(150deg,#515156,#2e2e31 55%,#1c1c1f)}
  .cv-sky{background:linear-gradient(150deg,#3f3f43,#212124 55%,#141416)}
  .cv-cream{background:linear-gradient(150deg,#5e5e62,#39393c 55%,#252528)}

  /* 칩 */
  .chips-wrap{padding:20px 0 6px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:9px 15px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:background .18s,color .18s;border:1px solid transparent}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff}
  .chip:focus-visible{outline:2px solid var(--blue-deep);outline-offset:2px}

  /* 섹션헤더 */
  .sec-head{display:flex;align-items:center;gap:9px;padding:26px 20px 6px}
  .sec-head svg{width:19px;height:19px}
  .sec-head h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
  .sec-head .count{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:600}

  /* 리스트 */
  .list{padding:8px 20px 4px}
  .row{display:grid;grid-template-columns:92px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
  .row:last-child{border-bottom:none}
  .row:active{opacity:.7}
  .row .thumb{width:92px;height:92px;border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .row .rtext .rcat{font-size:11px;font-weight:700;color:var(--blue-deep);letter-spacing:.05em}
  .row .rtext h3{margin:5px 0 5px;font-size:15.5px;font-weight:700;line-height:1.4;letter-spacing:-.01em;color:var(--ink)}
  .row .rtext .rex{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .row .rtext .rmeta{margin-top:7px;font-size:11.5px;color:var(--ink-3);font-weight:500}
  .empty{padding:40px 20px;text-align:center;color:var(--ink-3);font-size:13px;line-height:1.7}

  /* 뉴스레터 */
  .news{margin:26px 20px 8px;padding:24px 20px;border-radius:var(--radius);background:linear-gradient(150deg,#f5f5f6,#ececed);position:relative;overflow:hidden}
  .news .star-bg{position:absolute;right:-6px;top:-8px;opacity:.6}
  .news h3{margin:0 0 6px;font-size:16px;font-weight:800}
  .news p{margin:0 0 14px;font-size:12.5px;color:var(--ink-2);line-height:1.5;max-width:26ch}
  .news .field{display:flex;gap:8px}
  .news input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid #e3e3e6;background:#fff;font-size:13px;color:var(--ink)}
  .news input:focus{outline:none;border-color:var(--blue-deep)}
  .news .sub{padding:12px 16px;border-radius:12px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;white-space:nowrap}
  .news .sub:active{transform:scale(.97)}
  .news .done{font-size:13px;color:var(--blue-deep);font-weight:700;padding-top:2px}

  footer{padding:26px 20px 90px;text-align:center;color:var(--ink-3)}
  footer .fbrand{font-size:14px;font-weight:800;color:var(--ink-2);margin-bottom:6px}
  footer .fbrand em{font-style:normal;color:var(--blue-deep)}
  footer .fnote{font-size:11.5px;line-height:1.7}

  /* 글쓰기 플로팅 버튼 */
  .fab{position:fixed;z-index:40;bottom:24px;left:50%;transform:translateX(calc(215px - 100% - 20px));width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(43,44,52,.28)}
  .fab:active{transform:translateX(calc(215px - 100% - 20px)) scale(.94)}
  .fab svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2}
  @media(max-width:470px){.fab{left:auto;right:20px;transform:none}.fab:active{transform:scale(.94)}}

  /* 리더 */
  .reader{position:fixed;inset:0;z-index:50;background:var(--paper);max-width:430px;margin:0 auto;overflow-y:auto;transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);-webkit-overflow-scrolling:touch}
  .reader.open{transform:translateX(0)}
  .reader-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .reader-bar .back{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:600;padding:6px 6px 6px 2px;border-radius:10px}
  .reader-bar .back svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8}
  .reader-bar .rb-actions{margin-left:auto;display:flex;gap:4px}
  .reader-bar .rb-actions button{font-size:12.5px;font-weight:600;color:var(--ink-2);padding:6px 10px;border-radius:9px}
  .reader-bar .rb-actions button:hover{background:var(--chip)}
  .reader-bar .rb-actions .del{color:#c98a97}
  .reader-cover{aspect-ratio:16/10;position:relative}
  .article{padding:22px 22px 60px}
  .article .a-cat{display:inline-flex;align-items:center;font-size:12px;font-weight:700;color:var(--blue-deep);letter-spacing:.06em}
  .article .a-cat::before{content:"";display:inline-block;width:3px;height:13px;background:var(--blue-deep);border-radius:2px;margin-right:8px}
  .article h1{margin:12px 0 12px;font-size:26px;font-weight:800;line-height:1.3;letter-spacing:-.025em}
  .article .a-meta{font-size:12px;color:var(--ink-3);font-weight:500;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:20px}
  .article p{font-size:15px;line-height:1.75;color:#3a3b44;margin:0 0 18px}
  .article h4{font-size:16.5px;font-weight:800;margin:30px 0 11px;display:flex;align-items:stretch;gap:9px;letter-spacing:-.01em}
  .article h4 .h4-bar{flex:0 0 auto;width:3px;background:var(--blue-deep);border-radius:2px;align-self:stretch;margin:3px 0}
  .article h4 svg{width:14px;height:14px}
  .article .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:26px}
  .article .tags span{font-size:12px;color:var(--ink-2);background:var(--chip);padding:6px 11px;border-radius:999px;font-weight:600}
  .article .to-list{margin-top:30px;width:100%;padding:14px;border-radius:14px;background:var(--ink);color:#fff;font-size:14px;font-weight:700}

  /* 권한: 비운영자일 때 운영 전용 요소 숨김 */
  body:not(.admin) .admin-only{display:none !important}
  .rb-actions .rb-admin{display:inline-flex;gap:4px}
  .rb-actions .rb-icon{display:grid;place-items:center;padding:6px 8px;border-radius:9px}
  .rb-actions .rb-icon svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.7}

  /* 댓글 */
  .comments{margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
  .comments .c-head{display:flex;align-items:center;gap:7px;margin-bottom:14px}
  .comments .c-head svg{width:16px;height:16px;color:var(--blue-deep)}
  .comments .c-head h4{margin:0;font-size:15px;font-weight:800}
  .comments .c-head .cn{color:var(--ink-3);font-weight:700}
  .c-list{display:flex;flex-direction:column;gap:2px;margin-bottom:16px}
  .c-item{padding:12px 0;border-bottom:1px solid var(--line)}
  .c-item:last-child{border-bottom:none}
  .c-item .c-top{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
  .c-item .c-name{font-size:13px;font-weight:700}
  .c-item .c-time{font-size:11px;color:var(--ink-3)}
  .c-item .c-body{font-size:13.5px;color:#3a3b44;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .c-item .c-del{margin-left:auto;font-size:11px;color:var(--ink-3);padding:2px 6px;border-radius:7px}
  .c-item .c-del:hover{background:var(--chip);color:#c98a97}
  .c-empty{font-size:13px;color:var(--ink-3);padding:6px 0 14px}
  .c-form{background:var(--chip);border-radius:14px;padding:12px}
  .c-form input{width:100%;padding:9px 11px;border:1px solid #e3e3e6;border-radius:10px;background:#fff;font-size:13px;margin-bottom:8px}
  .c-form textarea{width:100%;padding:10px 11px;border:1px solid #e3e3e6;border-radius:10px;background:#fff;font-size:13.5px;line-height:1.5;resize:vertical;margin-bottom:8px}
  .c-form input:focus,.c-form textarea:focus{outline:none;border-color:var(--blue-deep)}
  .c-form .c-submit{width:100%;padding:11px;border-radius:10px;background:var(--ink);color:#fff;font-size:13px;font-weight:700}
  .c-form .c-submit:active{transform:scale(.99)}

  /* 로그인 모달 */
  .modal{position:fixed;inset:0;z-index:80;max-width:430px;margin:0 auto;display:grid;place-items:center;pointer-events:none}
  .modal .veil{position:absolute;inset:0;background:rgba(43,44,52,.34);opacity:0;transition:opacity .22s}
  .modal .box{position:relative;width:82%;max-width:320px;background:#fff;border-radius:18px;padding:22px 20px;box-shadow:var(--shadow);transform:translateY(8px) scale(.98);opacity:0;transition:transform .22s,opacity .22s}
  .modal.open{pointer-events:auto}
  .modal.open .veil{opacity:1}
  .modal.open .box{transform:none;opacity:1}
  .modal .box h3{margin:0 0 6px;font-size:16px;font-weight:800}
  .modal .box p{margin:0 0 14px;font-size:12.5px;color:var(--ink-2);line-height:1.5}
  .modal .box input{width:100%;padding:12px 13px;border:1px solid #e3e3e6;border-radius:12px;background:#fbfcfe;font-size:15px;text-align:center;letter-spacing:.15em}
  .modal .box input:focus{outline:none;border-color:var(--blue-deep);background:#fff}
  .modal .mbtns{display:flex;gap:8px;margin-top:14px}
  .modal .mbtns button{flex:1;padding:12px;border-radius:12px;font-size:14px;font-weight:700}
  .modal .mbtns .ghost{background:var(--chip);color:var(--ink-2)}
  .modal .mbtns .primary{background:var(--ink);color:#fff}

  /* 테스트 배너 */
  .quiz-banner{display:flex;align-items:center;gap:14px;width:calc(100% - 40px);margin:16px 20px 0;padding:16px 18px;border-radius:var(--radius);background:#161619;box-shadow:var(--shadow);text-align:left}
  .quiz-banner:active{transform:scale(.99)}
  .qb-stars{position:relative;width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center}
  .qb-stars svg:last-child{position:absolute;top:-2px;right:-2px}
  .qb-text{flex:1;min-width:0}
  .qb-eyebrow{font-size:11px;font-weight:700;color:var(--blue-deep);letter-spacing:.04em}
  .qb-title{font-size:16px;font-weight:800;margin:2px 0 3px}
  .qb-desc{font-size:12px;color:var(--ink-2)}
  .qb-go{width:22px;height:22px;flex:0 0 auto;color:var(--ink-3)}

  /* 퀴즈 오버레이 */
  .quiz{position:fixed;inset:0;z-index:75;background:var(--paper);max-width:430px;margin:0 auto;overflow-y:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);-webkit-overflow-scrolling:touch}
  .quiz.open{transform:translateY(0)}
  .quiz-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .quiz-bar .qx{width:30px;height:30px;display:grid;place-items:center;border-radius:9px}
  .quiz-bar .qx svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.7}
  .qprog{flex:1;height:6px;background:var(--chip);border-radius:99px;overflow:hidden}
  .qprog span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--blue-deep));border-radius:99px;transition:width .3s ease}
  .qcount{font-size:12px;font-weight:700;color:var(--ink-3);min-width:34px;text-align:right}

  .quiz-body{padding:26px 22px 60px}
  .q-num{font-size:12px;font-weight:700;color:var(--blue-deep);letter-spacing:.04em;margin-bottom:10px}
  .q-title{font-size:21px;font-weight:800;line-height:1.4;letter-spacing:-.02em;margin-bottom:22px}
  .q-opts{display:flex;flex-direction:column;gap:10px}
  .q-opt{text-align:left;padding:16px 16px;border-radius:15px;background:#fbfcfe;border:1.5px solid #e6e6e9;font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.45;transition:border-color .15s,background .15s,transform .08s}
  .q-opt:hover{border-color:var(--blue)}
  .q-opt:active{transform:scale(.99)}
  .q-opt.sel{border-color:var(--ink);background:#fff}
  .q-multi-hint{font-size:12px;color:var(--ink-3);margin:-10px 0 14px}
  .q-next{margin-top:22px;width:100%;padding:15px;border-radius:14px;background:var(--ink);color:#fff;font-size:15px;font-weight:700}
  .q-next:disabled{opacity:.4}

  /* 결과 */
  .result{padding:8px 22px 70px;text-align:center}
  .r-cover{margin:6px auto 20px;width:150px;height:150px;border-radius:26px;position:relative;overflow:hidden;box-shadow:var(--shadow);display:grid;place-items:center}
  .r-cover .rc-emoji{font-size:60px;filter:saturate(.9)}
  .r-cover .sketch{position:absolute}
  .r-eyebrow{font-size:12px;font-weight:700;color:var(--blue-deep);letter-spacing:.05em}
  .r-name{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px}
  .r-axes{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
  .r-axes span{font-size:11.5px;font-weight:700;color:var(--ink-2);background:var(--chip);padding:5px 11px;border-radius:99px}
  .r-desc{font-size:14.5px;color:#3a3b44;line-height:1.7;text-align:left;background:#fbfcfe;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px}
  .r-badges{display:flex;gap:10px;margin-bottom:16px}
  .r-badge{flex:1;background:#f2f2f4;border-radius:14px;padding:13px 10px}
  .r-badge .rb-k{font-size:11px;color:var(--ink-3);font-weight:700;margin-bottom:3px}
  .r-badge .rb-v{font-size:14px;font-weight:800;color:var(--ink)}
  .r-reco{text-align:left;margin-bottom:22px}
  .r-reco .rr-h{font-size:13px;font-weight:800;margin-bottom:9px;display:flex;align-items:center;gap:6px}
  .r-reco .rr-h svg{width:14px;height:14px;color:var(--blue-deep)}
  .r-reco .rr-list{display:flex;flex-wrap:wrap;gap:8px}
  .r-reco .rr-chip{font-size:12.5px;font-weight:700;color:var(--blue-deep);background:#f0f0f2;padding:8px 13px;border-radius:99px}
  .r-actions{display:flex;flex-direction:column;gap:9px}
  .r-actions .r-primary{padding:15px;border-radius:14px;background:var(--ink);color:#fff;font-size:15px;font-weight:700}
  .r-actions .r-ghost{padding:13px;border-radius:14px;background:var(--chip);color:var(--ink-2);font-size:14px;font-weight:700}
  .r-consent{font-size:11px;color:var(--ink-3);line-height:1.6;margin-top:16px}

  /* 에디터(글쓰기/수정) */
  .editor{position:fixed;inset:0;z-index:70;background:var(--paper);max-width:430px;margin:0 auto;overflow-y:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.4,0,.2,1)}
  .editor.open{transform:translateY(0)}
  .ed-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .ed-bar .ttl{font-size:15px;font-weight:800}
  .ed-bar .save{background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:8px 16px;border-radius:10px}
  .ed-bar .cancel{font-size:14px;color:var(--ink-2);font-weight:600;padding:6px}
  .ed-body{padding:18px 20px 60px}
  .fld{margin-bottom:16px}

<script>
/* ===================== 저장소 (window.storage → localStorage → 메모리) ===================== */
const store = (()=>{
  const cloud = (typeof window!=='undefined' && window.storage) ? window.storage : null;
  const mem = {};
  return {
    async get(k){
      if(cloud){ try{ const r=await cloud.get(k); return r? r.value : null; }catch(e){ return null; } }
      try{ return localStorage.getItem(k); }catch(e){ return (k in mem)?mem[k]:null; }
    },
    async set(k,v){
      if(cloud){ try{ await cloud.set(k,v); return true; }catch(e){ return false; } }
      try{ localStorage.setItem(k,v); return true; }catch(e){ mem[k]=v; return true; }
    },
    async del(k){
      if(cloud){ try{ await cloud.delete(k); return; }catch(e){ return; } }
      try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; }
    }
  };
})();
const K_ARTICLES='owi:articles';
const imgKey = id => 'owi:img:'+id;

/* ===================== 카테고리 ===================== */
const CATS=[
  {key:'playlist',label:'플레이리스트'},
  {key:'know',label:'음악 지식'},
  {key:'gear',label:'감상 기기'},
  {key:'live',label:'공연·페스티벌'},
];
const catLabel=k=>(CATS.find(c=>c.key===k)||{}).label||'';
const GRADS=['cv-sky','cv-blue','cv-pink','cv-lav','cv-mint','cv-cream'];

/* ===================== 기본 시드 ===================== */
const SEED=[
  {id:'jp-idol',cat:'playlist',cover:'cv-sky',title:'K-IDOL의 일본 발매곡 모음',
   excerpt:'일본 시장을 겨냥해 따로 준비한 곡들. 같은 팀인데도 한국 발매곡과는 결이 다르다.',
   date:'2026.07.24',tags:['#일본발매','#플레이리스트','#aespa'],
   body:`한국에서 활동하는 아이돌이 일본을 위해 따로 준비하는 곡들이 있다. 같은 팀이 부르는 노래인데도 편곡, 발성, 분위기의 결이 미묘하게 달라지는 경우가 많다. 이번 아카이빙에서는 최근 일본에서 먼저 공개된 곡들을 한자리에 모아봤다.

## 왜 따로 챙겨볼까
일본 발매곡은 현지 프로듀서와 협업하거나, 그 시장에서 오래 사랑받은 장르 문법을 적극적으로 끌어온다. 그래서 한국 앨범에서는 좀처럼 듣기 어려운 편곡을 만날 수 있고, 같은 아티스트의 또 다른 얼굴을 발견하는 재미가 있다.

좋아하는 팀이 있다면, 국내 앨범 다음에 일본 트랙을 한 번쯤 나란히 들어보길 추천한다.`},
  {id:'citypop',cat:'playlist',cover:'cv-pink',title:'비 그친 오후에 어울리는 시티팝 8곡',
   excerpt:'창밖이 조금 젖어 있을 때, 습기 머금은 신스와 잘 맞는 곡들을 골랐다.',
   date:'2026.07.20',tags:['#시티팝','#플레이리스트','#비오는날'],
   body:`비가 완전히 쏟아질 때보다, 막 그친 뒤의 눅눅하고 미지근한 공기가 시티팝과 제일 잘 어울린다.

볼륨은 조금 낮게, 스피커라면 벽에서 살짝 띄워두는 편이 좋다. 리버브가 방 안에서 자연스럽게 번진다.`},
  {id:'impedance',cat:'gear',cover:'cv-lav',title:'임피던스가 뭐길래: 이어폰 고를 때 보는 숫자',
   excerpt:'스펙표의 32Ω, 대체 무슨 의미일까. 초보자를 위한 가장 짧은 설명.',
   date:'2026.07.16',tags:['#감상기기','#이어폰','#입문'],
   body:`이어폰 스펙표를 보면 늘 'Ω(옴)' 단위가 붙은 숫자가 하나 있다. 이게 바로 임피던스, 쉽게 말해 '소리를 내기까지 필요한 힘'의 정도다.

## 핵심만
숫자가 낮으면(대략 16~32Ω) 스마트폰만으로도 충분히 큰 소리가 난다. 처음 유선 이어폰을 산다면 32Ω 안팎을 고르면 대부분의 기기에서 무난하게 잘 들린다.`},
  {id:'festival',cat:'live',cover:'cv-mint',title:'2026 여름 페스티벌 라인업 미리보기',
   excerpt:'올여름 국내외 주요 페스티벌 일정과 관전 포인트를 정리했다.',
   date:'2026.07.08',tags:['#공연','#페스티벌','#여름'],
   body:`여름은 페스티벌의 계절. 올해도 국내외에서 굵직한 라인업이 예고됐다.

## 체크 포인트
헤드라이너뿐 아니라 낮 시간대 서브 스테이지에 의외의 취향 저격 라인업이 숨어 있는 경우가 많다. 타임테이블이 공개되면 겹치는 무대부터 먼저 골라두자.`},
];

/* ===================== 상태 ===================== */
let ARTICLES=[];
let IMG_CACHE={};   // id -> base64 (로드된 커버 이미지)
let activeCat='all';
let editingId=null;   // 수정 중인 글 id
let currentReadId=null;
let draftCover={type:'gradient',val:'cv-sky',img:null};

/* ===================== 유틸 ===================== */
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function todayStr(){const d=new Date();const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}`;}
function slug(t){return (t||'article').trim().toLowerCase().replace(/[^\w가-힣]+/g,'-').replace(/^-+|-+$/g,'').slice(0,20) || 'article';}
function bodyToHTML(text){
  return (text||'').split(/\n\s*\n/).map(b=>{
    b=b.trim(); if(!b) return '';
    if(b.startsWith('## ')) return `<h4><span class="h4-bar"></span>${esc(b.slice(3).trim())}</h4>`;
    return `<p>${esc(b).replace(/\n/g,'<br/>')}</p>`;
  }).join('');
}
function coverInner(a){
  if(a.cover==='__img__' && IMG_CACHE[a.id]){
    return `<div class="cover"><img src="${IMG_CACHE[a.id]}" alt=""></div>`;
  }
  const cls = GRADS.includes(a.cover)?a.cover:'cv-sky';
  return `<div class="cover ${cls}"></div>`;
}
function sorted(){ return [...ARTICLES].sort((a,b)=> (a.date<b.date?1:a.date>b.date?-1:0)); }

/* ===================== 렌더 ===================== */
function renderChips(){
  const el=document.getElementById('chips');
  const all=[{key:'all',label:'전체'},...CATS];
  el.innerHTML=all.map(c=>`<button class="chip" data-cat="${c.key}" aria-pressed="${c.key===activeCat}">${c.label}</button>`).join('');
  el.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
    activeCat=b.dataset.cat;
    track('select_category',{category:activeCat,category_name:catLabel(activeCat)});
    renderChips();renderList();
  }));
}
function renderHero(){
  const list=sorted(); const a=list[0]; const card=document.getElementById('heroCard');
  if(!a){card.style.display='none';return;} card.style.display='';
  card.innerHTML=`<div class="hero-cover">${coverInner(a)}<div class="hero-veil"></div>

}
function renderList(){
  const el=document.getElementById('list');
  const items=sorted().filter(a=>activeCat==='all'?true:a.cat===activeCat);
  document.getElementById('count').textContent=items.length+'개';
  if(!items.length){el.innerHTML=`<div class="empty">이 카테고리에는 아직 아티클이 없어요.<br/>오른쪽 아래 <b>+</b> 버튼으로 첫 글을 써보세요.</div>`;return;}
  el.innerHTML=items.map(a=>`<article class="row" data-id="${a.id}">
    <div class="thumb">${coverInner(a)}</div>
    <div class="rtext"><div class="rcat">${catLabel(a.cat)}</div><h3>${esc(a.title)}</h3>
      <p class="rex">${esc(a.excerpt)}</p><div class="rmeta">${esc(a.date)}</div></div>
  </article>`).join('');

}
function renderAll(){renderHero();renderList();}

const reader=document.getElementById('reader');
function openArticle(id,source){
  const a=ARTICLES.find(x=>x.id===id); if(!a)return; currentReadId=id;
  track('view_article',{article_id:a.id,article_title:a.title,category:a.cat,source:source||'unknown'});
  document.getElementById('readerBody').innerHTML=`
    <div class="reader-cover">${coverInner(a)}</div>
    <div class="article">
      <div class="a-cat">${catLabel(a.cat)}</div>
      <h1>${esc(a.title)}</h1>
      <div class="a-meta">Owi Magazine · ${esc(a.date)}</div>
      ${bodyToHTML(a.body)}
      <div class="tags">${(a.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div>

      <section class="comments">
        <div class="c-head"><h4>댓글 <span class="cn" id="cCount">0</span></h4></div>
        <div class="c-list" id="cList"></div>
        <div class="c-form">
          <input type="text" id="cName" maxlength="20" placeholder="닉네임" />
          <textarea id="cText" rows="2" maxlength="500" placeholder="댓글을 남겨보세요"></textarea>
          <button class="c-submit" id="cSubmit">댓글 등록</button>

document.getElementById('shareBtn').onclick=async()=>{
  if(!currentReadId)return;
  const a=ARTICLES.find(x=>x.id===currentReadId);
  const url=location.origin+location.pathname+'#a/'+currentReadId;
  track('share_article',{article_id:currentReadId,article_title:a?a.title:''});
  try{
    if(navigator.share){ await navigator.share({title:a?a.title:'Owi Magazine',url}); return; }
    await navigator.clipboard.writeText(url); toast('링크를 복사했어요');
  }catch(e){ toast('링크: '+url); }
};

/* ---- 댓글 (아티클별 저장) ---- */
const cmtKey=id=>'owi:cmt:'+id;
function timeAgo(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return '방금 전'; if(s<3600)return Math.floor(s/60)+'분 전';
  if(s<86400)return Math.floor(s/3600)+'시간 전';
  const d=new Date(ts),p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}`;
}
async function loadComments(id){ const raw=await store.get(cmtKey(id)); if(!raw)return []; try{return JSON.parse(raw);}catch(e){return [];} }
async function renderComments(id){
  const list=await loadComments(id);
  const el=document.getElementById('cList'); const cnt=document.getElementById('cCount');
  if(!el)return; cnt.textContent=list.length;
  if(!list.length){ el.innerHTML=`<div class="c-empty">첫 댓글을 남겨보세요.</div>`; return; }
  el.innerHTML=list.map((c,i)=>`<div class="c-item">
    <div class="c-top"><span class="c-name">${esc(c.name||'익명')}</span><span class="c-time">${timeAgo(c.ts)}</span>
      <button class="c-del admin-only" data-i="${i}">삭제</button></div>
    <div class="c-body">${esc(c.text)}</div>
  </div>`).join('');
  el.querySelectorAll('.c-del').forEach(b=>b.onclick=async()=>{
    const arr=await loadComments(id); arr.splice(+b.dataset.i,1);
    await store.set(cmtKey(id),JSON.stringify(arr)); renderComments(id);
  });
}
async function addComment(id){
  const name=(document.getElementById('cName').value||'').trim().slice(0,20)||'익명';
  const text=(document.getElementById('cText').value||'').trim();
  if(!text){document.getElementById('cText').focus();return;}
  const arr=await loadComments(id);
  arr.push({name,text,ts:Date.now()});
  await store.set(cmtKey(id),JSON.stringify(arr));
  document.getElementById('cName').value=''; document.getElementById('cText').value='';
  track('add_comment',{article_id:id});
  renderComments(id); toast('댓글을 등록했어요');
}
function closeArticle(){reader.classList.remove('open');reader.setAttribute('aria-hidden','true');currentReadId=null;}
document.getElementById('readerBack').onclick=closeArticle;
document.getElementById('editBtn').onclick=()=>{ if(currentReadId) openEditor(currentReadId); };
document.getElementById('delBtn').onclick=async()=>{
  if(!currentReadId)return;
  if(!confirm('이 아티클을 삭제할까요?'))return;
  const a=ARTICLES.find(x=>x.id===currentReadId);
  track('delete_article',{article_id:currentReadId,article_title:a?a.title:''});
  ARTICLES=ARTICLES.filter(x=>x.id!==currentReadId);
  await store.del(imgKey(currentReadId)); delete IMG_CACHE[currentReadId];
  await persist(); closeArticle(); renderAll(); toast('삭제했어요');
};

/* ===================== 에디터 ===================== */
const editor=document.getElementById('editor');
function buildCoverPick(){
  const el=document.getElementById('coverPick');
  let html=GRADS.map(g=>`<button type="button" class="sw ${g}" data-grad="${g}" aria-pressed="${draftCover.type==='gradient'&&draftCover.val===g}"></button>`).join('');
  html+=`<label class="up-btn" title="이미지 업로드"><svg viewBox="0 0 24 24"><path d="M12 16V4m0 0l-4 4m4-4l4 4M5 20h14" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <input type="file" id="edFile" accept="image/*" hidden></label>`;
  el.innerHTML=html;
  if(draftCover.type==='image'&&draftCover.img){
    const p=document.createElement('div');p.className='up-preview';p.innerHTML=`<img src="${draftCover.img}" alt="">`;el.appendChild(p);
  }
  el.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{draftCover={type:'gradient',val:b.dataset.grad,img:null};buildCoverPick();});
  const file=document.getElementById('edFile');
  file.onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{draftCover={type:'image',val:null,img:rd.result};buildCoverPick();};
    rd.readAsDataURL(f);
  };
}
function fillCatSelect(sel){document.getElementById('edCat').innerHTML=CATS.map(c=>`<option value="${c.key}" ${c.key===sel?'selected':''}>${c.label}</option>`).join('');}

function openEditor(id){
  editingId=id||null;
  document.getElementById('edTitle').textContent = id?'아티클 수정':'새 아티클';
  if(id){
    const a=ARTICLES.find(x=>x.id===id);
    fillCatSelect(a.cat);
    document.getElementById('edDate').value=a.date;
    document.getElementById('edTitleInput').value=a.title;
    document.getElementById('edExcerpt').value=a.excerpt;
    document.getElementById('edBody').value=a.body;
    document.getElementById('edTags').value=(a.tags||[]).map(t=>t.replace(/^#/,'')).join(', ');
    draftCover = (a.cover==='__img__'&&IMG_CACHE[id]) ? {type:'image',val:null,img:IMG_CACHE[id]} : {type:'gradient',val:GRADS.includes(a.cover)?a.cover:'cv-sky',img:null};
  }else{
    fillCatSelect('playlist');
    document.getElementById('edDate').value=todayStr();
    document.getElementById('edTitleInput').value='';
    document.getElementById('edExcerpt').value='';
    document.getElementById('edBody').value='';
    document.getElementById('edTags').value='';
    draftCover={type:'gradient',val:GRADS[Math.floor(Math.random()*GRADS.length)],img:null};
  }
  buildCoverPick();
  closeArticle();
  editor.classList.add('open');editor.setAttribute('aria-hidden','false');editor.scrollTop=0;
}
function closeEditor(){editor.classList.remove('open');editor.setAttribute('aria-hidden','true');editingId=null;}
document.getElementById('edCancel').onclick=closeEditor;
document.getElementById('fab').onclick=()=>openEditor(null);

document.getElementById('edSave').onclick=async()=>{
  const title=document.getElementById('edTitleInput').value.trim();
  if(!title){toast('제목을 입력해 주세요');document.getElementById('edTitleInput').focus();return;}
  const cat=document.getElementById('edCat').value;
  const date=document.getElementById('edDate').value.trim()||todayStr();
  const excerpt=document.getElementById('edExcerpt').value.trim();
  const body=document.getElementById('edBody').value;
  const tags=document.getElementById('edTags').value.split(',').map(s=>s.trim()).filter(Boolean).map(s=>s.startsWith('#')?s:'#'+s);

  let id=editingId;
  if(!id){ id=slug(title)+'-'+Date.now().toString(36).slice(-4); }

  // 커버 처리
  let cover;
  if(draftCover.type==='image'&&draftCover.img){
    cover='__img__'; IMG_CACHE[id]=draftCover.img; await store.set(imgKey(id),draftCover.img);
  }else{
    cover=draftCover.val||'cv-sky';
    if(IMG_CACHE[id]){ delete IMG_CACHE[id]; await store.del(imgKey(id)); } // 이미지→그라디언트 전환 정리
  }

  const rec={id,cat,cover,title,excerpt:excerpt||title,date,tags,body};
  if(editingId){
    ARTICLES=ARTICLES.map(a=>a.id===id?rec:a);
    track('edit_article',{article_id:id,article_title:title,category:cat});
  }else{
    ARTICLES.push(rec);
    track('create_article',{article_id:id,article_title:title,category:cat,has_image:draftCover.type==='image'});
  }
  await persist(); closeEditor(); renderAll(); toast(editingId?'수정했어요':'새 아티클을 올렸어요');
};

/* ===================== 저장/로드 ===================== */
async function persist(){
  // 이미지 base64는 별도 키에 저장하므로, 목록에는 메타만 저장
  const meta=ARTICLES.map(a=>({id:a.id,cat:a.cat,cover:a.cover,title:a.title,excerpt:a.excerpt,date:a.date,tags:a.tags,body:a.body}));
  await store.set(K_ARTICLES,JSON.stringify(meta));
}
async function load(){
  let raw=await store.get(K_ARTICLES);
  if(!raw){ ARTICLES=JSON.parse(JSON.stringify(SEED)); await persist(); }
  else{ try{ARTICLES=JSON.parse(raw);}catch(e){ARTICLES=JSON.parse(JSON.stringify(SEED));} }
  // 이미지 커버 로드
  for(const a of ARTICLES){
    if(a.cover==='__img__'){ const img=await store.get(imgKey(a.id)); if(img) IMG_CACHE[a.id]=img; }
  }
}

const K_DEFCOV='owi:defcov:bw:v1';
async function applyDefaultCovers(){
  const done=await store.get(K_DEFCOV);
  if(done==='1') return;
  let changed=false;
  for(const id in DEFAULT_COVERS){
    const a=ARTICLES.find(x=>x.id===id);
    if(!a) continue;
    if(a.cover==='__img__' && IMG_CACHE[id]) continue;
    a.cover='__img__'; IMG_CACHE[id]=DEFAULT_COVERS[id];
    await store.set(imgKey(id), DEFAULT_COVERS[id]); changed=true;
  }
  if(changed) await persist();
  await store.set(K_DEFCOV,'1');
}

const menu=document.getElementById('menu');
function openMenu(){menu.classList.add('open');menu.setAttribute('aria-hidden','false');}
function closeMenu(){menu.classList.remove('open');menu.setAttribute('aria-hidden','true');}
document.getElementById('menuBtn').onclick=openMenu;
document.getElementById('menuClose').onclick=closeMenu;
document.getElementById('menuVeil').onclick=closeMenu;
function buildMenu(){
  const items=[{key:'all',label:'전체'},...CATS];
  document.getElementById('menuNav').innerHTML=
    items.map(c=>`<button data-cat="${c.key}">${c.label}</button>`).join('')+
    `<button data-quiz="1">음악 유형 테스트</button>`+
    `<button class="admin-only" data-write="1">새 글 쓰기</button>`+
    (isAdmin
      ? `<button data-logout="1">운영자 로그아웃</button>`
      : `<button data-login="1">관리자 로그인</button>`);
  document.querySelectorAll('#menuNav button').forEach(b=>b.onclick=async()=>{
    if(b.dataset.write){closeMenu();openEditor(null);return;}
    if(b.dataset.quiz){closeMenu();openQuiz();return;}
    if(b.dataset.login){closeMenu();openLogin();return;}
    if(b.dataset.logout){await setAdmin(false);closeMenu();toast('로그아웃했어요');return;}
    activeCat=b.dataset.cat;track('select_category',{category:activeCat,category_name:catLabel(activeCat),source:'menu'});
    renderChips();renderList();closeMenu();document.querySelector('.sec-head').scrollIntoView({behavior:'smooth'});
  });
}

const loginModal=document.getElementById('loginModal');

document.getElementById('pinOk').onclick=async()=>{

const quiz=document.getElementById('quiz');
let qState=null;
function openQuiz(){
  qState={i:0,score:{E:0,R:0,A:0,F:0,S:0,I:0},data:{},answers:[]};
  track('quiz_start',{});
  quiz.classList.add('open');quiz.setAttribute('aria-hidden','false');quiz.scrollTop=0;
  renderQuestion();
}
function closeQuiz(){quiz.classList.remove('open');quiz.setAttribute('aria-hidden','true');qState=null;}
document.getElementById('quizClose').onclick=closeQuiz;
function setProgress(){
  const total=QUESTIONS.length, cur=Math.min(qState.i,total);
  document.getElementById('qprogFill').style.width=(cur/total*100)+'%';
  document.getElementById('qcount').textContent=Math.min(qState.i+1,total)+'/'+total;
}
function renderQuestion(){
  const total=QUESTIONS.length;
  if(qState.i>=total){renderResult();return;}
  const Q=QUESTIONS[qState.i]; setProgress();
  let sel=null; const body=document.getElementById('quizBody');
  body.innerHTML=`
    <div class="q-num">Q${qState.i+1}</div>
    <div class="q-title">${Q.q}</div>
    <div class="q-opts">${Q.opts.map((o,idx)=>`<button class="q-opt" data-idx="${idx}">${o.t}</button>`).join('')}</div>
    <button class="q-next" id="qNext" disabled>다음</button>`;
  quiz.scrollTop=0;
  body.querySelectorAll('.q-opt').forEach(b=>b.onclick=()=>{
    sel=+b.dataset.idx;
    body.querySelectorAll('.q-opt').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); document.getElementById('qNext').disabled=false;
  });
  document.getElementById('qNext').onclick=()=>{
    if(sel===null)return;
    const o=Q.opts[sel];
    for(const k in (o.ax||{})) qState.score[k]+=o.ax[k];
    qState.data[Q.data]=o.v; qState.answers.push({q:Q.id,v:o.v});
    track('quiz_answer',{question_id:Q.id,answer:String(o.v),data_key:Q.data});
    qState.i++; renderQuestion();
  };
}
function pick(a,b,s){ return s[a]>=s[b]?a:b; }   // 동점 시 앞 축(E·A·S) 우선
function computeType(){
  const s=qState.score;
  const key=[pick('E','R',s),pick('A','F',s),pick('S','I',s)].join('-');
  return {key,type:TYPES[key]};
}
function renderResult(){
  document.getElementById('qprogFill').style.width='100%';
  document.getElementById('qcount').textContent='결과';
  const {key,type}=computeType();
  const genre=qState.data.fav_genre, gear=+qState.data.gear_level||0;
  track('quiz_complete',{result_type:key,result_name:type.name,fav_genre:genre,gear_level:gear,
    discovery_channel:qState.data.discovery_channel,listen_context:qState.data.listen_context,spend_type:qState.data.spend_type,
    axis_E:qState.score.E,axis_R:qState.score.R,axis_A:qState.score.A,axis_F:qState.score.F,axis_S:qState.score.S,axis_I:qState.score.I});
  track('set_user_properties',{music_type:key,music_type_name:type.name,fav_genre:genre,gear_level:gear});
  const body=document.getElementById('quizBody');
  body.innerHTML=`
    <div class="result">
      <div class="r-cover ${type.cover}">
        <span class="rc-emoji">${type.emoji}</span>
      </div>
      <div class="r-eyebrow">나의 음악 유형</div>
      <div class="r-name">${type.name}</div>
      <div class="r-axes">${type.axes.map(a=>`<span>${a}</span>`).join('')}</div>
      <div class="r-desc">${type.desc}</div>
      <div class="r-badges">
        <div class="r-badge"><div class="rb-k">선호 장르</div><div class="rb-v">${genreLabel(genre)}</div></div>
        <div class="r-badge"><div class="rb-k">감상 기기</div><div class="rb-v">${GEAR_LABEL[gear]}</div></div>
      </div>
      <div class="r-reco">
        <div class="rr-h">이런 콘텐츠를 추천해요</div>
        <div class="rr-list">${type.reco.map(r=>`<span class="rr-chip">${r}</span>`).join('')}</div>
      </div>
      <div class="r-actions">
        <button class="r-primary" id="rShare">결과 공유하기</button>
        <button class="r-ghost" id="rNews">새 아티클 DM 구독</button>
        <button class="r-ghost" id="rRetry">다시 하기</button>
      </div>
      <div class="r-consent">테스트 응답은 익명으로 취향 분석에만 활용돼요.</div>
    </div>`;
  quiz.scrollTop=0;
  document.getElementById('rRetry').onclick=openQuiz;
  document.getElementById('rNews').onclick=()=>{closeQuiz();document.querySelector('.news').scrollIntoView({behavior:'smooth'});document.getElementById('newsInput').focus();};
  document.getElementById('rShare').onclick=async()=>{
    const txt=`나의 음악 유형은 '${type.name}' ${type.emoji} | Owi Magazine`;
    const url=location.origin+location.pathname+'#quiz';
    track('quiz_share',{result_type:key,result_name:type.name});
    try{
      if(navigator.share){ await navigator.share({title:'Owi 음악 유형 테스트',text:txt,url}); return; }
      await navigator.clipboard.writeText(txt+' '+url); toast('결과 링크를 복사했어요');
    }catch(e){ toast('결과: '+type.name); }
  };
}
document.getElementById('quizBanner').onclick=()=>openQuiz();

/* ===================== 시작 ===================== */
(async function init(){
  await load();
  await applyDefaultCovers();
  const adm=await store.get(K_ADMIN); isAdmin=(adm==='1');
  renderChips(); applyAdmin(); renderAll();
  const hash=location.hash||'';
  const m=hash.match(/^#a\/(.+)$/);                 // 공유 링크: 아티클
  if(m){ const id=decodeURIComponent(m[1]); if(ARTICLES.find(x=>x.id===id)) openArticle(id,'link'); }
  else if(hash==='#quiz'){ openQuiz(); }            // 공유 링크: 테스트
  track('page_view',{page:'home',page_title:'Owi Magazine'});
})();
</script>
