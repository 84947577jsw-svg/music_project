backend:
  name: git-gateway
  branch: main

media_folder: "content/images"
public_folder: "/content/images"

locale: "ko"

collections:
  - name: "articles"
    label: "아티클"
    label_singular: "아티클"
    folder: "content/articles"
    create: true
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}}  ·  {{date | date('YYYY.MM.DD')}}"
    sortable_fields: [date, title]
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - label: "카테고리"
        name: "cat"
        widget: "select"
        options:
          - { label: "플레이리스트", value: "playlist" }
          - { label: "음악 지식", value: "know" }
          - { label: "감상 기기", value: "gear" }
          - { label: "공연·페스티벌", value: "live" }
      - label: "커버 스타일"
        name: "cover"
        widget: "select"
        hint: "그라디언트를 고르거나, 아래 '커버 이미지'를 올리면 이미지가 우선 적용됩니다."
        default: "cv-sky"
        options:
          - { label: "스카이", value: "cv-sky" }
          - { label: "블루", value: "cv-blue" }
          - { label: "핑크", value: "cv-pink" }
          - { label: "라벤더", value: "cv-lav" }
          - { label: "민트", value: "cv-mint" }
          - { label: "크림", value: "cv-cream" }
      - { label: "커버 이미지 (선택)", name: "coverImage", widget: "image", required: false, hint: "올리면 그라디언트 대신 이 이미지가 커버로 쓰입니다." }
      - { label: "요약 (한 줄 소개)", name: "excerpt", widget: "text" }
      - { label: "발행일", name: "date", widget: "datetime", date_format: "YYYY.MM.DD", time_format: false, format: "YYYY.MM.DD" }
      - { label: "태그", name: "tags", widget: "list", default: [], hint: "예: 시티팝, 플레이리스트" }
      - { label: "본문", name: "body", widget: "markdown", hint: "'## 소제목' 형식으로 소제목을 넣을 수 있습니다." }
      - { label: "슬러그(주소용, 영문 권장)", name: "slug", widget: "string", hint: "글의 고유 주소. 예: citypop-rainy" }
